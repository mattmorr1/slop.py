[workspace]
resolver = "2"
members = [
    "crates/slop",
    "crates/slop-analyze",
    "crates/slop-graph",
    "crates/slop-llm",
    "crates/slop-lsp",
    "crates/slop-mcp",
    "crates/slop-tui",
    "crates/slop-parse",
    "crates/slop-proxy",
    "crates/slop-resolve",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/mattmorr1/slop.py"
readme = "README.md"
keywords = ["static-analysis", "developer-tools", "scip", "ai"]
categories = ["development-tools"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
petgraph = "0.8"
scip = "0.9"
protobuf = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
toml = "0.8"
ruff_python_parser = "0.0.3"
ruff_python_ast = "0.0.3"
ruff_text_size = "0.0.3"
ureq = { version = "2", features = ["json"] }

slop-graph = { version = "0.1.0", path = "crates/slop-graph" }
slop-llm = { version = "0.1.0", path = "crates/slop-llm" }
slop-lsp = { version = "0.1.0", path = "crates/slop-lsp" }
slop-mcp = { version = "0.1.0", path = "crates/slop-mcp" }
slop-parse = { version = "0.1.0", path = "crates/slop-parse" }
slop-tui = { version = "0.1.0", path = "crates/slop-tui" }
slop-proxy = { version = "0.1.0", path = "crates/slop-proxy" }
slop-resolve = { version = "0.1.0", path = "crates/slop-resolve" }
slop-analyze = { version = "0.1.0", path = "crates/slop-analyze" }
