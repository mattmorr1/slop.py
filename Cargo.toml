[workspace]
resolver = "2"
members = [
    "crates/slop",
    "crates/slop-analyze",
    "crates/slop-graph",
    "crates/slop-llm",
    "crates/slop-mcp",
    "crates/slop-parse",
    "crates/slop-proxy",
    "crates/slop-resolve",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/matthewmorris/slop.py"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
petgraph = "0.8"
scip = "0.9"
protobuf = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
toml = "0.8"
ruff_python_parser = "0.0.3"
ruff_python_ast = "0.0.3"
ruff_text_size = "0.0.3"
ureq = { version = "2", features = ["json"] }

slop-graph = { path = "crates/slop-graph" }
slop-llm = { path = "crates/slop-llm" }
slop-mcp = { path = "crates/slop-mcp" }
slop-parse = { path = "crates/slop-parse" }
slop-proxy = { path = "crates/slop-proxy" }
slop-resolve = { path = "crates/slop-resolve" }
slop-analyze = { path = "crates/slop-analyze" }
