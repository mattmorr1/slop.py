[workspace]
resolver = "2"
members = [
    "crates/slop",
    "crates/slop-analyze",
    "crates/slop-graph",
    "crates/slop-resolve",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/matthewmorris/slop.py"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
petgraph = "0.8"
scip = "0.9"
protobuf = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
toml = "0.8"

slop-graph = { path = "crates/slop-graph" }
slop-resolve = { path = "crates/slop-resolve" }
slop-analyze = { path = "crates/slop-analyze" }
