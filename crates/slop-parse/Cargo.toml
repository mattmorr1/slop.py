[package]
name = "slop-parse"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Cross-language source facts and canonical forms for the slop analyzer"
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
anyhow = { workspace = true }
blake3 = { workspace = true }
ruff_python_parser = { workspace = true }
ruff_python_ast = { workspace = true }
ruff_text_size = { workspace = true }
tree-sitter = "0.24"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
# 0.23 to match the tree-sitter 0.24 runtime's grammar ABI (0.24 grammars are ABI 15).
tree-sitter-rust = "0.23"
egglog = { version = "3.0.0", optional = true }

[features]
# Bounded equality saturation for E-equivalence research; the normalizer is the default engine.
egraph = ["dep:egglog"]
