name: publish crates

on:
  workflow_dispatch:
    inputs:
      version:
        description: Workspace version to publish
        required: true
        default: 0.1.0

concurrency:
  group: crates-io-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: crates-io
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
      - run: cargo test --workspace --locked
      - name: Publish dependency waves
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: bash scripts/publish-crates.sh "${{ inputs.version }}" --execute
