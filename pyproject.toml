[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "slop-cli"
dynamic = ["version"]
description = "Codebase-relative AI-slop analyzer for Python, JS/TS and Rust, with an agent harness"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
keywords = ["static-analysis", "developer-tools", "scip", "ai"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Repository = "https://github.com/mattmorr1/slop.py"

[tool.maturin]
bindings = "bin"
manifest-path = "crates/slop/Cargo.toml"
locked = true
include = [{ path = "LICENSE", format = "sdist" }]
