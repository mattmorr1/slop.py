entry_points = [
    "services.weather.latest_forecast",
    "utils.dates.format_date",
]

[channels]
net = ["core.http_client.HttpClient"]

# Pure computation utilities must not do their own I/O — it belongs in a
# service. `utils.scoring` violates this (raw net + file reads).
[[layer]]
name = "pure-utils"
match = ["utils.scoring"]
forbid = ["net", "fs"]
